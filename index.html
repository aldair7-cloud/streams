<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream TV Azteca - Ligero</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body, html {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background: black; 
            overflow: hidden;
        }
        video {
            width: 100%; 
            height: 100%; 
            object-fit: fill; /* Hace que el video ocupe toda la pantalla */
        }
    </style>
</head>
<body>

    <video id="video" autoplay muted controls></video>

    <script>
        var video = document.getElementById('video');
        // Este es el enlace M3U8 directo que extrajimos de tu código
        var videoSrc = 'https://content.uplynk.com/6994be4d5caab0723aaab37c.m3u8'; 

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>
</body>
</html>
